<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Studio — Калькулятор CSS: 3D, фильтры, градиенты, анимации</title>
    <meta name="description" content="CSS Studio — интерактивный калькулятор CSS: 32 панели с ползунками, живым превью и готовым кодом — значения цвета и углов, 2D/3D-трансформации, тени, стекло, фильтры, смешивание, градиенты, паттерны и типографика." />
    <meta name="theme-color" content="#09080f" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231b1236'/%3E%3Cstop offset='100%25' stop-color='%230c0a17'/%3E%3C/linearGradient%3E%3ClinearGradient id='g1' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='55%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3ClinearGradient id='g2' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0%25' stop-color='%23f472b6' stop-opacity='.85'/%3E%3Cstop offset='100%25' stop-color='%2322d3ee' stop-opacity='.9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23bg)'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='14.5' fill='none' stroke='%23a78bfa' stroke-opacity='.35' stroke-width='1.5'/%3E%3Cpath d='M32 10L52 21.5L32 33L12 21.5Z' fill='url(%23g1)'/%3E%3Cpath d='M12 31.5L32 43L52 31.5' fill='none' stroke='url(%23g2)' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12 42L32 53.5L52 42' fill='none' stroke='%23a78bfa' stroke-opacity='.65' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #09080f;
        --bg-elevated: #100e1b;
        --surface: #141222;
        --surface-2: #1b182e;
        --sunken: #0d0b16;
        --input: #171429;
        --track: #26213d;
        --ink: #f3f0ff;
        --muted: #9a93b8;
        --dim: #6c658a;
        --accent: #a78bfa;
        --accent-strong: #7c3aed;
        --cyan: #22d3ee;
        --pink: #f472b6;
        --green: #4ade80;
        --line: rgb(167 139 250 / 0.14);
        --line-strong: rgb(167 139 250 / 0.28);
        --shadow-sm: 0 2px 10px rgb(0 0 0 / 0.25);
        --shadow-lg: 0 18px 50px rgb(0 0 0 / 0.45);
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --sidebar-w: 288px;
        --header-h: 64px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-block-size: 100dvh;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 80% 50% at 15% -10%, rgb(124 58 237 / 0.16), transparent 60%),
          radial-gradient(ellipse 60% 45% at 90% 10%, rgb(34 211 238 / 0.08), transparent 55%);
        background-attachment: fixed;
        color: var(--ink);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar { inline-size: 8px; block-size: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgb(167 139 250 / 0.18); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgb(167 139 250 / 0.35); }

      /* ---------- APP SHELL ---------- */
      .app-shell {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        min-block-size: 100dvh;
      }

      /* ---------- SIDEBAR ---------- */
      .sidebar {
        position: sticky;
        inset-block-start: 0;
        block-size: 100dvh;
        display: flex;
        flex-direction: column;
        background: rgb(14 12 24 / 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-inline-end: 1px solid var(--line);
        z-index: 40;
      }

      .sidebar__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 16px 18px 14px;
        border-block-end: 1px solid var(--line);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 11px;
        text-decoration: none;
        color: inherit;
        min-inline-size: 0;
      }

      .logo__mark {
        flex: 0 0 auto;
        inline-size: 36px;
        block-size: 36px;
        border-radius: 11px;
        box-shadow: 0 0 0 1px rgb(167 139 250 / 0.25), 0 6px 18px rgb(124 58 237 / 0.35);
      }

      .logo__text { display: grid; line-height: 1.15; }
      .logo__title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #fff 20%, #c4b5fd 70%, #67e8f9 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .logo__sub { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }

      .sidebar__close {
        display: none;
        place-items: center;
        inline-size: 34px;
        block-size: 34px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .sidebar__close:hover { color: var(--ink); border-color: var(--line-strong); }

      .sidebar__search { padding: 12px 14px 8px; }
      .search-box { position: relative; display: flex; align-items: center; }
      .search-box svg {
        position: absolute;
        inset-inline-start: 11px;
        inline-size: 15px;
        block-size: 15px;
        color: var(--dim);
        pointer-events: none;
      }
      .search-box input {
        inline-size: 100%;
        block-size: 36px;
        padding: 0 32px 0 34px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--sunken);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        transition: border-color 150ms ease, background-color 150ms ease;
      }
      .search-box input::placeholder { color: var(--dim); }
      .search-box input:focus { outline: none; border-color: var(--accent); background: var(--input); }
      .search-box kbd {
        position: absolute;
        inset-inline-end: 8px;
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--dim);
        font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
      }

      .tabs {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 8px 12px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .tab-group { display: flex; flex-direction: column; gap: 4px; }
      .tab-group.is-empty { display: none; }
      .tab-group__label {
        padding: 4px 10px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .tab-row { display: flex; flex-direction: column; gap: 2px; }

      .tab {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        inline-size: 100%;
        padding: 9px 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-align: start;
        cursor: pointer;
        transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease;
      }
      .tab.is-hidden { display: none; }
      .tab:hover { color: var(--ink); background: rgb(167 139 250 / 0.08); }
      .tab__num { font: 600 10px/1 ui-monospace, monospace; color: var(--dim); }
      .tab[aria-selected="true"] {
        color: #fff;
        font-weight: 600;
        background: linear-gradient(135deg, rgb(124 58 237 / 0.85), rgb(167 139 250 / 0.25));
        border-color: rgb(167 139 250 / 0.4);
        box-shadow: 0 4px 16px rgb(124 58 237 / 0.25);
      }
      .tab[aria-selected="true"] .tab__num { color: rgb(255 255 255 / 0.75); }
      .tab[aria-selected="true"]::before {
        content: "";
        position: absolute;
        inset-inline-start: 0;
        inset-block: 7px;
        inline-size: 3px;
        border-radius: 999px;
        background: var(--cyan);
      }

      .drawer-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgb(5 4 12 / 0.65);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 35;
      }
      .drawer-backdrop.is-open { display: block; }

      /* ---------- MAIN COLUMN ---------- */
      .workspace-wrap {
        display: flex;
        flex-direction: column;
        min-inline-size: 0;
        min-block-size: 100dvh;
      }

      .topbar {
        position: sticky;
        inset-block-start: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-block-size: var(--header-h);
        padding: 10px 28px;
        background: rgb(9 8 15 / 0.8);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-block-end: 1px solid var(--line);
      }

      .topbar__left { display: flex; align-items: center; gap: 12px; min-inline-size: 0; }
      .topbar__title-wrap { display: flex; flex-direction: column; min-inline-size: 0; }
      .topbar__cat {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .topbar__title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .menu-btn,
      .icon-btn {
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        inline-size: 36px;
        block-size: 36px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        cursor: pointer;
        transition: all 140ms ease;
      }
      .menu-btn { display: none; }
      .menu-btn:hover,
      .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface-2); }

      .topbar__actions { display: flex; align-items: center; gap: 8px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        block-size: 36px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        font: 600 12.5px/1 inherit;
        cursor: pointer;
        transition: all 140ms ease;
        white-space: nowrap;
      }
      .btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
      .btn--accent {
        background: linear-gradient(135deg, var(--accent-strong), #6d28d9);
        border-color: rgb(167 139 250 / 0.45);
        color: #fff;
      }
      .btn--accent:hover { filter: brightness(1.1); }
      .btn--success { background: rgb(34 197 94 / 0.18); border-color: rgb(74 222 128 / 0.5); color: var(--green); }

      /* ---------- WORKSPACE SPLIT ---------- */
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        gap: 24px;
        padding: 24px 28px 36px;
        align-items: start;
      }

      .stage-col {
        position: sticky;
        inset-block-start: calc(var(--header-h) + 24px);
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-inline-size: 0;
      }

      .controls-col {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-inline-size: 0;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .card__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        border-block-end: 1px solid var(--line);
        background: rgb(255 255 255 / 0.015);
      }

      .card__label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* ---------- PREVIEW STAGE ---------- */
      .bg-switch { display: flex; gap: 4px; }
      .bg-switch button {
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: 600 11px/1.2 inherit;
        cursor: pointer;
      }
      .bg-switch button.is-active {
        background: rgb(167 139 250 / 0.18);
        border-color: var(--accent);
        color: var(--ink);
      }

      .preview-stage {
        position: relative;
        display: grid;
        place-items: center;
        min-block-size: 320px;
        padding: 36px 24px;
        overflow: hidden;
        background-color: var(--sunken);
        background-image:
          linear-gradient(rgb(167 139 250 / 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgb(167 139 250 / 0.07) 1px, transparent 1px);
        background-size: 24px 24px;
        transition: background-color 180ms ease;
      }
      .preview-stage[data-bg="light"] {
        background-color: #f4f2fc;
        background-image:
          linear-gradient(rgb(124 58 237 / 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgb(124 58 237 / 0.08) 1px, transparent 1px);
      }
      .preview-stage[data-bg="photo"] {
        background:
          radial-gradient(circle at 20% 25%, #7c3aed 0%, transparent 45%),
          radial-gradient(circle at 80% 75%, #06b6d4 0%, transparent 48%),
          radial-gradient(circle at 55% 40%, #ec4899 0%, transparent 45%),
          #0d0b16;
      }

      /* Preview elements */
      .x-pad {
        position: absolute;
        inset-block-start: 0;
        inset-inline-start: 0;
        inline-size: 100%;
        block-size: 100%;
        pointer-events: none;
      }
      .x-handle {
        position: absolute;
        inline-size: 14px;
        block-size: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        background: #0b0a12;
        border: 2px solid var(--accent);
        box-shadow: 0 0 0 3px rgb(167 139 250 / 0.18);
        cursor: grab;
        pointer-events: auto;
        touch-action: none;
      }
      .x-handle:active { cursor: grabbing; }
      .x-stops { display: grid; gap: 8px; }
      .x-stop {
        display: grid;
        grid-template-columns: 34px 1fr 64px 28px;
        align-items: center;
        gap: 8px;
      }
      .x-stop input[type="color"] {
        inline-size: 34px;
        block-size: 28px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: transparent;
        padding: 0;
      }
      .x-stop input[type="range"] { inline-size: 100%; }
      .x-stop__pos {
        font: 600 12px/1 ui-monospace, monospace;
        color: var(--muted);
        text-align: end;
      }
      .x-stop__del, .x-add {
        font: inherit;
        color: var(--muted);
        background: var(--input);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        padding: 4px 8px;
      }
      .x-stop__del:hover, .x-add:hover { color: var(--ink); border-color: var(--line-strong); }

      .demo-box {
        inline-size: 180px;
        block-size: 180px;
        border-radius: 22px;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.02em;
        user-select: none;
        position: relative;
      }
      .demo-box--light { background: #1e1b33; border: 1px solid rgb(167 139 250 / 0.25); }
      .demo-text {
        margin: 0;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1.1;
        text-align: center;
        color: #fff;
        max-inline-size: 100%;
        word-break: break-word;
      }
      .preview-stage[data-bg="light"] .demo-text { color: #161326; }

      .blend-scene {
        position: relative;
        inline-size: 240px;
        block-size: 180px;
        border-radius: 18px;
        background: linear-gradient(135deg, #f43f5e, #f59e0b 50%, #06b6d4);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .blend-circle {
        inline-size: 118px;
        block-size: 118px;
        border-radius: 50%;
        background: #7c3aed;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 15px;
      }

      .anim-track {
        inline-size: min(100%, 340px);
        block-size: 64px;
        padding: 8px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.06);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
      }
      .anim-ball {
        inline-size: 46px;
        block-size: 46px;
        border-radius: 50%;
        background: linear-gradient(135deg, #a855f7, #22d3ee);
        box-shadow: 0 0 24px rgb(168 85 247 / 0.55);
      }

      /* ---------- CODE BLOCK ---------- */
      .code-pre {
        margin: 0;
        padding: 16px 18px;
        background: var(--sunken);
        color: #e2dcff;
        font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        min-block-size: 92px;
      }
      .tok-prop { color: #67e8f9; }
      .tok-val { color: #f5d0fe; }
      .tok-punc { color: #7e779e; }

      /* ---------- PRESETS & CONTROLS ---------- */
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 16px;
      }
      .preset-btn {
        padding: 7px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg-elevated);
        color: var(--muted);
        font: 600 12px/1.2 inherit;
        cursor: pointer;
        transition: all 140ms ease;
      }
      .preset-btn:hover { color: var(--ink); border-color: var(--accent); background: rgb(167 139 250 / 0.12); }

      .controls-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 18px 18px 20px;
      }

      .ctrl { display: flex; flex-direction: column; gap: 7px; }
      .ctrl__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .ctrl__label { font-size: 13px; font-weight: 600; color: var(--ink); }
      .ctrl__num-wrap {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--input);
      }
      .ctrl__num {
        inline-size: 56px;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: 600 12.5px/1.4 ui-monospace, monospace;
        text-align: end;
      }
      .ctrl__num:focus { outline: none; }
      .ctrl__unit { font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        inline-size: 100%;
        block-size: 6px;
        border-radius: 999px;
        background: var(--track);
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        inline-size: 17px;
        block-size: 17px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c4b5fd, #22d3ee);
        border: 2px solid #09080f;
        box-shadow: 0 0 0 2px rgb(167 139 250 / 0.35);
        transition: transform 120ms ease;
      }
      input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
      input[type="range"]::-moz-range-thumb {
        inline-size: 17px;
        block-size: 17px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c4b5fd, #22d3ee);
        border: 2px solid #09080f;
      }

      .ctrl__row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .ctrl__select,
      .ctrl__text {
        inline-size: 100%;
        block-size: 36px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--input);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }
      .ctrl__select:focus,
      .ctrl__text:focus { outline: none; border-color: var(--accent); }

      .ctrl__color-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ctrl__color {
        inline-size: 40px;
        block-size: 32px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--input);
        cursor: pointer;
      }
      .ctrl__hex {
        font: 600 12px/1 ui-monospace, monospace;
        color: var(--muted);
        text-transform: uppercase;
      }

      .switch {
        position: relative;
        display: inline-block;
        inline-size: 42px;
        block-size: 24px;
      }
      .switch input { opacity: 0; inline-size: 0; block-size: 0; }
      .switch__slider {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--track);
        border: 1px solid var(--line);
        cursor: pointer;
        transition: 160ms ease;
      }
      .switch__slider::before {
        content: "";
        position: absolute;
        inset-block-start: 2px;
        inset-inline-start: 2px;
        inline-size: 18px;
        block-size: 18px;
        border-radius: 50%;
        background: #fff;
        transition: 160ms ease;
      }
      .switch input:checked + .switch__slider { background: var(--accent-strong); border-color: var(--accent); }
      .switch input:checked + .switch__slider::before { transform: translateX(18px); }

      .panel-note {
        margin: 0;
        padding: 12px 16px;
        border-block-start: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        background: rgb(167 139 250 / 0.04);
      }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 1120px) {
        .workspace {
          grid-template-columns: 1fr;
          padding: 18px 20px 32px;
        }
        .stage-col {
          position: static;
          display: contents;
        }
        .preview-card { order: 1; }
        .controls-col { order: 2; }
        .code-card { order: 3; }
      }

      @media (max-width: 860px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar {
          position: fixed;
          inset-block: 0;
          inset-inline-start: 0;
          inline-size: min(86vw, 310px);
          transform: translateX(-100%);
          transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);

        .topbar { padding: 10px 14px; }
        .topbar__title { font-size: 15px; }
        .btn__text-hide { display: none; }
        .preview-stage { min-block-size: 250px; padding: 24px 16px; }
      }
    </style>

    <script>
      const hexToRgba = (hex, alpha = 1) => {
        const clean = hex.replace('#', '');
        const r = parseInt(clean.slice(0, 2), 16);
        const g = parseInt(clean.slice(2, 4), 16);
        const b = parseInt(clean.slice(4, 6), 16);
        return `rgb(${r} ${g} ${b} / ${alpha})`;
      };

      const studioImages = {};
      const studioStops = {};

      function getStops(id, defs) {
        if (!studioStops[id]) studioStops[id] = defs.map((st) => ({ ...st }));
        return studioStops[id];
      }

      function stopEditor(panelId, defs) {
        return (container, vals, refresh) => {
          const stops = getStops(panelId, defs);
          const wrap = document.createElement('div');
          wrap.className = 'ctrl';
          wrap.innerHTML = `<label class="ctrl__label">Цветовые стопы</label>
            <div class="x-stops"></div>
            <button type="button" class="x-add" style="margin-block-start:8px">+ стоп</button>`;
          const list = wrap.querySelector('.x-stops');
          const draw = () => {
            list.innerHTML = '';
            stops.forEach((st, i) => {
              const row = document.createElement('div');
              row.className = 'x-stop';
              row.innerHTML = `<input type="color" value="${st.c}" aria-label="Цвет ${i + 1}" />
                <input type="range" min="0" max="100" step="1" value="${st.p}" aria-label="Позиция ${i + 1}" />
                <span class="x-stop__pos">${Math.round(st.p)}%</span>
                <button type="button" class="x-stop__del" aria-label="Удалить стоп">×</button>`;
              const [color, range] = row.querySelectorAll('input');
              color.addEventListener('input', () => { st.c = color.value; refresh(); });
              range.addEventListener('input', () => {
                st.p = Number(range.value);
                row.querySelector('.x-stop__pos').textContent = Math.round(st.p) + '%';
                refresh();
              });
              row.querySelector('.x-stop__del').addEventListener('click', () => {
                if (stops.length <= 2) return;
                stops.splice(i, 1);
                draw();
                refresh();
              });
              list.appendChild(row);
            });
          };
          draw();
          wrap.querySelector('.x-add').addEventListener('click', () => {
            stops.push({ c: '#ffffff', p: 100 });
            draw();
            refresh();
          });
          container.appendChild(wrap);
        };
      }

      function makeImagePicker(panelId, label) {
        const wrap = document.createElement('div');
        wrap.className = 'ctrl';
        wrap.innerHTML = `<label class="ctrl__label">${label}</label>
          <div style="display:flex;gap:8px;align-items:center;margin-block-start:6px">
            <input type="file" accept="image/*" class="x-add" style="max-inline-size:100%" />
            <button type="button" class="x-add x-clear">убрать</button>
          </div>`;
        const input = wrap.querySelector('input[type="file"]');
        const clear = wrap.querySelector('.x-clear');
        input.addEventListener('change', () => {
          const file = input.files && input.files[0];
          if (!file) return;
          if (studioImages[panelId] && studioImages[panelId].startsWith('blob:')) {
            URL.revokeObjectURL(studioImages[panelId]);
          }
          studioImages[panelId] = URL.createObjectURL(file);
          renderPreviewAndCode();
        });
        clear.addEventListener('click', () => {
          delete studioImages[panelId];
          input.value = '';
          renderPreviewAndCode();
        });
        return wrap;
      }

      const clipPoints = [
        { x: 50, y: 4 }, { x: 92, y: 26 }, { x: 82, y: 76 },
        { x: 50, y: 96 }, { x: 18, y: 76 }, { x: 8, y: 26 }
      ];

      const PANELS = [
        // 1. Форма и рамки
        {
          id: 'border-radius',
          cat: 'Форма и рамки',
          title: 'Скругление углов',
          tags: 'border-radius corners pill blob',
          controls: [
            { k: 'tl', label: 'Верхний левый', type: 'range', min: 0, max: 100, step: 1, unit: 'px', def: 24 },
            { k: 'tr', label: 'Верхний правый', type: 'range', min: 0, max: 100, step: 1, unit: 'px', def: 24 },
            { k: 'br', label: 'Нижний правый', type: 'range', min: 0, max: 100, step: 1, unit: 'px', def: 24 },
            { k: 'bl', label: 'Нижний левый', type: 'range', min: 0, max: 100, step: 1, unit: 'px', def: 24 }
          ],
          presets: [
            { name: 'Карточка', v: { tl: 20, tr: 20, br: 20, bl: 20 } },
            { name: 'Круг', v: { tl: 90, tr: 90, br: 90, bl: 90 } },
            { name: 'Лепесток', v: { tl: 90, tr: 12, br: 90, bl: 12 } },
            { name: 'Капля', v: { tl: 90, tr: 90, br: 90, bl: 8 } }
          ],
          render(v) {
            const val = v.tl === v.tr && v.tr === v.br && v.br === v.bl
              ? `${v.tl}px`
              : `${v.tl}px ${v.tr}px ${v.br}px ${v.bl}px`;
            return {
              html: `<div class="demo-box" style="border-radius:${val}">Box</div>`,
              css: `border-radius: ${val};`
            };
          }
        },
        {
          id: 'organic-blob',
          cat: 'Форма и рамки',
          title: 'Органический Blob (8 точек)',
          tags: 'border-radius blob organic shape',
          controls: [
            { k: 'a', label: 'Верх-лево X', type: 'range', min: 10, max: 90, step: 1, unit: '%', def: 62 },
            { k: 'b', label: 'Верх-право X', type: 'range', min: 10, max: 90, step: 1, unit: '%', def: 38 },
            { k: 'c', label: 'Низ-право X', type: 'range', min: 10, max: 90, step: 1, unit: '%', def: 58 },
            { k: 'd', label: 'Низ-лево X', type: 'range', min: 10, max: 90, step: 1, unit: '%', def: 42 },
            { k: 'e', label: 'Лево-верх Y', type: 'range', min: 10, max: 90, step: 1, unit: '%', def: 46 },
            { k: 'f', label: 'Право-верх Y', type: 'range', min: 10, max: 90, step: 1, unit: '%', def: 54 }
          ],
          presets: [
            { name: 'Камень', v: { a: 62, b: 38, c: 58, d: 42, e: 46, f: 54 } },
            { name: 'Облако', v: { a: 74, b: 26, c: 68, d: 32, e: 32, f: 68 } },
            { name: 'Кристалл', v: { a: 30, b: 70, c: 30, d: 70, e: 70, f: 30 } }
          ],
          render(v) {
            const val = `${v.a}% ${v.b}% ${v.c}% ${v.d}% / ${v.e}% ${v.f}% ${100 - v.f}% ${100 - v.e}%`;
            return {
              html: `<div class="demo-box" style="border-radius:${val}">Blob</div>`,
              css: `border-radius: ${val};`
            };
          }
        },
        {
          id: 'clip-path',
          cat: 'Форма и рамки',
          title: 'Clip-Path фигуры',
          tags: 'clip-path polygon circle inset mask',
          controls: [
            { k: 'shape', label: 'Форма', type: 'select', def: 'polygon', options: [
              ['polygon', 'Многоугольник (скос)'],
              ['hexagon', 'Шестиугольник'],
              ['custom', 'Своя форма (точки)'],
              ['circle', 'Круг'],
              ['inset', 'Обрезка (inset)']
            ]},
            { k: 'p1', label: 'Параметр 1', type: 'range', min: 0, max: 50, step: 1, unit: '%', def: 18 },
            { k: 'p2', label: 'Параметр 2 / Радиус', type: 'range', min: 10, max: 70, step: 1, unit: '%', def: 46 }
          ],
          presets: [
            { name: 'Скошенная карточка', v: { shape: 'polygon', p1: 18, p2: 46 } },
            { name: 'Шестиугольник', v: { shape: 'hexagon', p1: 25, p2: 50 } },
            { name: 'Круглая маска', v: { shape: 'circle', p1: 20, p2: 45 } },
            { name: 'Рамка Inset', v: { shape: 'inset', p1: 14, p2: 24 } }
          ],
          render(v) {
            let val = '';
            if (v.shape === 'polygon') val = `polygon(${v.p1}% 0%, 100% 0%, ${100 - v.p1}% 100%, 0% 100%)`;
            else if (v.shape === 'hexagon') val = `polygon(${v.p1}% 0%, ${100 - v.p1}% 0%, 100% 50%, ${100 - v.p1}% 100%, ${v.p1}% 100%, 0% 50%)`;
            else if (v.shape === 'custom') val = `polygon(${clipPoints.map((pt) => `${pt.x.toFixed(1)}% ${pt.y.toFixed(1)}%`).join(', ')})`;
            else if (v.shape === 'circle') val = `circle(${v.p2}% at 50% 50%)`;
            else val = `inset(${v.p1}% round ${v.p2}px)`;
            const custom = v.shape === 'custom' ? ' data-custom="1"' : '';
            return {
              html: `<div class="demo-box" style="border-radius:0;clip-path:${val}"${custom}>Clip</div>`,
              css: `clip-path: ${val};`
            };
          },
          mount(stage, v, rerender) {
            if (v.shape !== 'custom') return;
            const box = stage.querySelector('.demo-box');
            if (!box) return;
            const pad = document.createElement('div');
            pad.className = 'x-pad';
            box.appendChild(pad);
            clipPoints.forEach((pt, i) => {
              const dot = document.createElement('button');
              dot.type = 'button';
              dot.className = 'x-handle';
              dot.style.left = pt.x + '%';
              dot.style.top = pt.y + '%';
              dot.setAttribute('aria-label', `Точка ${i + 1}`);
              let dragging = false;
              const move = (event) => {
                if (!dragging) return;
                const rect = box.getBoundingClientRect();
                pt.x = Math.min(100, Math.max(0, ((event.clientX - rect.left) / rect.width) * 100));
                pt.y = Math.min(100, Math.max(0, ((event.clientY - rect.top) / rect.height) * 100));
                dot.style.left = pt.x + '%';
                dot.style.top = pt.y + '%';
                box.style.clipPath = `polygon(${clipPoints.map((q) => `${q.x.toFixed(1)}% ${q.y.toFixed(1)}%`).join(', ')})`;
              };
              dot.addEventListener('pointerdown', (event) => {
                dragging = true;
                dot.setPointerCapture(event.pointerId);
                event.preventDefault();
              });
              dot.addEventListener('pointermove', move);
              dot.addEventListener('pointerup', () => { dragging = false; rerender(); });
              dot.addEventListener('pointercancel', () => { dragging = false; rerender(); });
              pad.appendChild(dot);
            });
          }
        },
        {
          id: 'outline',
          cat: 'Форма и рамки',
          title: 'Border и Outline',
          tags: 'border outline offset focus ring',
          controls: [
            { k: 'bw', label: 'Толщина border', type: 'range', min: 0, max: 14, step: 1, unit: 'px', def: 2 },
            { k: 'ow', label: 'Толщина outline', type: 'range', min: 0, max: 14, step: 1, unit: 'px', def: 3 },
            { k: 'off', label: 'Смещение outline', type: 'range', min: -16, max: 24, step: 1, unit: 'px', def: 6 },
            { k: 'style', label: 'Стиль outline', type: 'select', def: 'solid', options: [['solid','solid'],['dashed','dashed'],['dotted','dotted'],['double','double']] },
            { k: 'color', label: 'Цвет outline', type: 'color', def: '#22d3ee' }
          ],
          presets: [
            { name: 'Focus Ring', v: { bw: 2, ow: 3, off: 5, style: 'solid', color: '#22d3ee' } },
            { name: 'Пунктирная рамка', v: { bw: 2, ow: 2, off: 8, style: 'dashed', color: '#a78bfa' } },
            { name: 'Внутренний контур', v: { bw: 3, ow: 2, off: -10, style: 'solid', color: '#f472b6' } }
          ],
          render(v) {
            const css = `border: ${v.bw}px solid rgb(167 139 250 / 0.45);\noutline: ${v.ow}px ${v.style} ${v.color};\noutline-offset: ${v.off}px;`;
            return {
              html: `<div class="demo-box demo-box--light" style="${css.replaceAll('\n','')}">Focus</div>`,
              css
            };
          }
        },

        // 2. Трансформации и 3D
        {
          id: 'transform-2d',
          cat: 'Трансформации и 3D',
          title: '2D Transform',
          tags: 'transform translate rotate scale skew',
          controls: [
            { k: 'tx', label: 'Сдвиг X (translateX)', type: 'range', min: -120, max: 120, step: 1, unit: 'px', def: 0 },
            { k: 'ty', label: 'Сдвиг Y (translateY)', type: 'range', min: -90, max: 90, step: 1, unit: 'px', def: 0 },
            { k: 'rot', label: 'Поворот (rotate)', type: 'range', min: -180, max: 180, step: 1, unit: 'deg', def: 12 },
            { k: 'sc', label: 'Масштаб (scale)', type: 'range', min: 0.4, max: 1.5, step: 0.05, unit: '', def: 1 },
            { k: 'skx', label: 'Наклон X (skewX)', type: 'range', min: -40, max: 40, step: 1, unit: 'deg', def: 0 }
          ],
          presets: [
            { name: 'Лёгкий наклон', v: { tx: 0, ty: 0, rot: 12, sc: 1, skx: 0 } },
            { name: 'Изометрия', v: { tx: 0, ty: 0, rot: -15, sc: 0.95, skx: 20 } },
            { name: 'Hover-подъём', v: { tx: 0, ty: -14, rot: 0, sc: 1.08, skx: 0 } }
          ],
          render(v) {
            const val = `translate(${v.tx}px, ${v.ty}px) rotate(${v.rot}deg) scale(${v.sc}) skewX(${v.skx}deg)`;
            return {
              html: `<div class="demo-box" style="transform:${val}">2D</div>`,
              css: `transform: ${val};`
            };
          }
        },
        {
          id: 'transform-3d',
          cat: 'Трансформации и 3D',
          title: '3D Перспектива',
          tags: '3d perspective rotateX rotateY rotateZ translateZ',
          controls: [
            { k: 'persp', label: 'Перспектива', type: 'range', min: 150, max: 1400, step: 10, unit: 'px', def: 600 },
            { k: 'rx', label: 'Rotate X', type: 'range', min: -75, max: 75, step: 1, unit: 'deg', def: 18 },
            { k: 'ry', label: 'Rotate Y', type: 'range', min: -75, max: 75, step: 1, unit: 'deg', def: -24 },
            { k: 'rz', label: 'Rotate Z', type: 'range', min: -60, max: 60, step: 1, unit: 'deg', def: 0 },
            { k: 'tz', label: 'Глубина (translateZ)', type: 'range', min: -80, max: 80, step: 1, unit: 'px', def: 20 },
            { k: 'ox', label: 'Точка схода X', type: 'range', min: 0, max: 100, step: 1, unit: '%', def: 50 },
            { k: 'oy', label: 'Точка схода Y', type: 'range', min: 0, max: 100, step: 1, unit: '%', def: 50 },
            { k: 'units', label: 'Единицы перспективы', type: 'select', def: 'px', options: [['px','px'],['em','em'],['rem','rem'],['none','none']] },
            { k: 'preserve', label: 'preserve-3d', type: 'toggle', def: true },
            { k: 'backface', label: 'Показывать обратную грань', type: 'toggle', def: true }
          ],
          presets: [
            { name: 'Карточка 3D', v: { persp: 600, rx: 18, ry: -24, rz: 0, tz: 20 } },
            { name: 'Витрина', v: { persp: 800, rx: 32, ry: 0, rz: 0, tz: 0 } },
            { name: 'Острый ракурс', v: { persp: 320, rx: 12, ry: 38, rz: -6, tz: 30 } }
          ],

          ],
          render(v) {
            const hover = v.prop === 'opacity' ? 'opacity:.25' : v.prop === 'background-color' ? 'background:#22d3ee' : v.prop === 'inline-size' ? 'inline-size:60px' : 'transform:translateX(70px) rotate(12deg)';
            const html = `
              <div class="demo-box" id="trBox" style="border-radius:18px;transition:${v.prop} ${v.dur}s ${v.ease} ${v.delay}s;cursor:pointer">hover</div>
              <style>#trBox:hover{${hover}}</style>
              <p class="demo-caption">наведите курсор на блок</p>`;
            const css = `.box {\n  transition: ${v.prop} ${v.dur}s ${v.ease} ${v.delay}s;\n}\n\n.box:hover {\n  ${hover};\n}`;
            return { html, css };
          }
        },
        {
          id: 'keyframes',
          cat: 'Движение',
          title: '@keyframes',
          tags: 'keyframes анимация кадры from to',
          controls: [
            { k: 'c1', label: 'Цвет в начале', type: 'color', def: '#7c3aed' },
            { k: 'c2', label: 'Цвет в конце', type: 'color', def: '#22d3ee' },
            { k: 'tx', label: 'Сдвиг по X', type: 'range', min: -80, max: 80, step: 2, unit: 'px', def: 40 },
            { k: 'dur', label: 'Длительность', type: 'range', min: 0.5, max: 4, step: 0.1, unit: 's', def: 1.6 },
            { k: 'inf', label: 'Бесконечно', type: 'toggle', def: true }
          ],
          presets: [
            { name: 'Пульс', v: { c1: '#7c3aed', c2: '#22d3ee', tx: 0, dur: 1.6, inf: true } },
            { name: 'Туда-обратно', v: { c1: '#f472b6', c2: '#f59e0b', tx: 60, dur: 1.2, inf: true } },
            { name: 'Один раз', v: { c1: '#4ade80', c2: '#22d3ee', tx: -40, dur: 2, inf: false } }
          ],
          render(v) {
            const name = 'studioKeyframes';
            const iter = v.inf ? 'infinite' : '1';
            const html = `
              <div class="demo-box" style="animation:${name} ${v.dur}s ease-in-out ${iter};border-radius:20px">anim</div>
              <style>@keyframes ${name}{0%{transform:translateX(0) rotate(0);background:${v.c1}}50%{transform:translateX(${v.tx}px) rotate(8deg)}100%{transform:translateX(0) rotate(0);background:${v.c2}}}</style>
              <p class="demo-caption">${v.dur}s · ${iter}</p>`;
            const css = `@keyframes ${name} {\n  0% {\n    transform: translateX(0) rotate(0);\n    background: ${v.c1};\n  }\n  50% {\n    transform: translateX(${v.tx}px) rotate(8deg);\n  }\n  100% {\n    transform: translateX(0) rotate(0);\n    background: ${v.c2};\n  }\n}\n\n.box {\n  animation: ${name} ${v.dur}s ease-in-out ${iter};\n}`;
            return { html, css };
          }
        },
        {
          id: 'color-animation',
          cat: 'Движение',
          title: 'Анимация цвета (@property)',
          tags: 'property @property hue градиент анимация цвета перелив',
          controls: [
            { k: 'mode', label: 'Режим', type: 'select', def: 'hue', options: [
              ['hue','Перелив --hue'],['gradient','Угол градиента --angle'],['bg','Фон'],['text','Текст']
            ]},
            { k: 'c1', label: 'Цвет 1', type: 'color', def: '#7c3aed' },
            { k: 'c2', label: 'Цвет 2', type: 'color', def: '#22d3ee' },
            { k: 'dur', label: 'Длительность', type: 'range', min: 1, max: 8, step: 0.5, unit: 's', def: 4 }
          ],
          presets: [
            { name: 'Перелив', v: { mode: 'hue', c1: '#7c3aed', c2: '#22d3ee', dur: 4 } },
            { name: 'Угол', v: { mode: 'gradient', c1: '#f472b6', c2: '#22d3ee', dur: 5 } },
            { name: 'Текст', v: { mode: 'text', c1: '#a78bfa', c2: '#4ade80', dur: 3 } }
          ],
          render(v) {
            const name = 'studioColorAnim';
            const dur = v.dur + 's';
            let html, css;
            if (v.mode === 'hue') {
              html = `<div class="demo-box" style="background:hsl(var(--hue) 83% 58%);animation:${name} ${dur} linear infinite;border-radius:20px">HUE</div>
                <style>@property --hue{syntax:"<angle>";inherits:false;initial-value:262deg}@keyframes ${name}{to{--hue:382deg}}</style>`;
              css = `@property --hue {\n  syntax: "<angle>";\n  inherits: false;\n  initial-value: 262deg;\n}\n\n@keyframes ${name} {\n  to { --hue: 382deg; }\n}\n\n.box {\n  background: hsl(var(--hue) 83% 58%);\n  animation: ${name} ${dur} linear infinite;\n}`;
            } else if (v.mode === 'gradient') {
              html = `<div class="demo-box" style="background:linear-gradient(var(--angle), ${v.c1}, ${v.c2});animation:${name} ${dur} linear infinite;border-radius:20px">ANGLE</div>
                <style>@property --angle{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes ${name}{to{--angle:360deg}}</style>`;
              css = `@property --angle {\n  syntax: "<angle>";\n  inherits: false;\n  initial-value: 0deg;\n}\n\n@keyframes ${name} {\n  to { --angle: 360deg; }\n}\n\n.box {\n  background: linear-gradient(var(--angle), ${v.c1}, ${v.c2});\n  animation: ${name} ${dur} linear infinite;\n}`;
            } else if (v.mode === 'text') {
              html = `<p class="demo-text" style="background:linear-gradient(90deg, ${v.c1}, ${v.c2}, ${v.c1});background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:${name} ${dur} linear infinite">COLOR</p>
                <style>@keyframes ${name}{to{background-position:200% 0}}</style>`;
              css = `@keyframes ${name} {\n  to { background-position: 200% 0; }\n}\n\n.text {\n  background: linear-gradient(90deg, ${v.c1}, ${v.c2}, ${v.c1});\n  background-size: 200% 100%;\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n  animation: ${name} ${dur} linear infinite;\n}`;
            } else {
              html = `<div class="demo-box" style="background:${v.c1};animation:${name} ${dur} ease-in-out infinite alternate;border-radius:20px">BG</div>
                <style>@keyframes ${name}{to{background:${v.c2}}}</style>`;
              css = `@keyframes ${name} {\n  to { background: ${v.c2}; }\n}\n\n.box {\n  background: ${v.c1};\n  animation: ${name} ${dur} ease-in-out infinite alternate;\n}`;
            }
            return { html, css };
          }
        },
        {
          id: 'background-blend',
          cat: 'Оформление',
          title: 'Background Blend',
          tags: 'background-blend-mode картинка градиент multiply screen',
          controls: [
            { k: 'mode', label: 'Режим', type: 'select', def: 'screen', options: [
              ['normal','normal'],['multiply','multiply'],['screen','screen'],['overlay','overlay'],
              ['soft-light','soft-light'],['difference','difference'],['multiply','multiply']
            ]},
            { k: 'c1', label: 'Цвет 1', type: 'color', def: '#7c3aed' },
            { k: 'c2', label: 'Цвет 2', type: 'color', def: '#f472b6' },
            { k: 'alpha', label: 'Прозрачность градиента', type: 'range', min: 0.2, max: 1, step: 0.05, unit: '', def: 0.85 },
            { k: 'scene', label: 'Картинка', type: 'select', def: 'landscape', options: [
              ['landscape','Пейзаж'],['portrait','Портрет'],['texture','Текстура']
            ]}
          ],
          customUI(container) {
            container.appendChild(makeImagePicker('background-blend', 'Своя картинка (файл)'));
          },
          presets: [
            { name: 'Дуотон', v: { mode: 'multiply', c1: '#2563eb', c2: '#f472b6', alpha: 1, scene: 'portrait' } },
            { name: 'Неон', v: { mode: 'screen', c1: '#22d3ee', c2: '#a855f7', alpha: 0.85, scene: 'landscape' } },
            { name: 'Винтаж', v: { mode: 'soft-light', c1: '#f59e0b', c2: '#7c2d12', alpha: 1, scene: 'texture' } }
          ],
          render(v) {
            const palettes = {
              landscape: ['#0b1020', '#1d4ed8', '#22d3ee', '#fbbf24'],
              portrait: ['#1b1035', '#7c3aed', '#f472b6', '#fde68a'],
              texture: ['#0f172a', '#334155', '#94a3b8', '#e2e8f0']
            };
            const [sky, mid, accent, light] = palettes[v.scene] || palettes.landscape;
            const svg = v.scene === 'portrait'
              ? `<circle cx='400' cy='200' r='110' fill='${light}'/><path d='M230 520c0-95 76-170 170-170s170 75 170 170z' fill='${accent}'/>`
              : v.scene === 'texture'
                ? Array.from({length: 12}, (_, i) => `<rect x='${i*70}' y='0' width='30' height='520' fill='${i%2?accent:mid}' opacity='${0.25+(i%3)*0.2}'/>`).join('')
                : `<circle cx='600' cy='150' r='80' fill='${accent}'/><path d='M0 380c120-90 260-90 400 0s280 90 400 0v140H0z' fill='${mid}'/><path d='M0 450c140-70 280-70 420 0s260 70 380 0v70H0z' fill='${accent}' opacity='0.85'/>`;
            const custom = studioImages['background-blend'];
            const img = custom
              ? `url('${custom}')`
              : `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='800' height='520'><rect width='800' height='520' fill='${sky}'/>${svg}</svg>`)}")`;
            const html = `<div style="inline-size:min(100%,360px);block-size:220px;border-radius:18px;background-image:linear-gradient(135deg, ${v.c1}, ${v.c2}), ${img};background-size:cover;background-position:center;background-blend-mode:${v.mode};border:1px solid var(--line-strong)"></div>
              <p class="demo-caption">background-blend-mode: ${v.mode}</p>`;
            const css = `.hero {\n  background-image:\n    linear-gradient(135deg, ${v.c1}, ${v.c2}),\n    url("photo.jpg");\n  background-blend-mode: ${v.mode};\n  background-size: cover;\n  background-position: center;\n}`;
            return { html, css };
          }
        }
      ];

      // State
      const state = {};
      PANELS.forEach((p) => {
        state[p.id] = {};
        p.controls.forEach((c) => (state[p.id][c.k] = c.def));
      });

      let activeId = PANELS[0].id;
      let currentCss = '';

      // DOM refs
      const tabsContainer = document.getElementById('tabsContainer');
      const panelSearch = document.getElementById('panelSearch');
      const activeCat = document.getElementById('activeCat');
      const activeTitle = document.getElementById('activeTitle');
      const previewStage = document.getElementById('previewStage');
      const codeOutput = document.getElementById('codeOutput');
      const presetsContainer = document.getElementById('presetsContainer');
      const controlsContainer = document.getElementById('controlsContainer');
      const panelNote = document.getElementById('panelNote');
      const copyBtn = document.getElementById('copyBtn');
      const resetBtn = document.getElementById('resetBtn');
      const prevBtn = document.getElementById('prevPanel');
      const nextBtn = document.getElementById('nextPanel');
      const sidebar = document.getElementById('sidebar');
      const drawerBackdrop = document.getElementById('drawerBackdrop');
      const menuBtn = document.getElementById('menuBtn');
      const sidebarClose = document.getElementById('sidebarClose');

      function highlightCss(raw) {
        return raw
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/^([a-z-]+)(:)/gm, '<span class="tok-prop">$1</span><span class="tok-punc">$2</span>');
      }

      function buildSidebar() {
        const groups = new Map();
        PANELS.forEach((p, idx) => {
          if (!groups.has(p.cat)) groups.set(p.cat, []);
          groups.get(p.cat).push({ ...p, idx: idx + 1 });
        });

        tabsContainer.innerHTML = '';
        groups.forEach((items, cat) => {
          const groupEl = document.createElement('div');
          groupEl.className = 'tab-group';
          groupEl.innerHTML = `<div class="tab-group__label">${cat}</div><div class="tab-row"></div>`;
          const row = groupEl.querySelector('.tab-row');

          items.forEach((p) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'tab';
            btn.dataset.id = p.id;
            btn.dataset.search = `${p.title} ${p.cat} ${p.tags}`.toLowerCase();
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-selected', p.id === activeId ? 'true' : 'false');
            btn.innerHTML = `<span>${p.title}</span><span class="tab__num">${String(p.idx).padStart(2, '0')}</span>`;
            btn.addEventListener('click', () => {
              selectPanel(p.id);
              closeDrawer();
            });
            row.appendChild(btn);
          });

          tabsContainer.appendChild(groupEl);
        });
      }

      function renderPreviewAndCode() {
        const panel = PANELS.find((p) => p.id === activeId);
        const vals = state[activeId];
        const out = panel.render(vals);
        previewStage.innerHTML = out.html;
        currentCss = out.css;
        codeOutput.innerHTML = highlightCss(out.css);
        if (typeof panel.mount === 'function') {
          panel.mount(previewStage, vals, renderPreviewAndCode);
        }
      }

      function buildControls() {
        const panel = PANELS.find((p) => p.id === activeId);
        const vals = state[activeId];

        activeCat.textContent = panel.cat;
        activeTitle.textContent = panel.title;

        // Presets
        presetsContainer.innerHTML = '';
        (panel.presets || []).forEach((pr) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'preset-btn';
          btn.textContent = pr.name;
          btn.addEventListener('click', () => {
            Object.assign(state[activeId], pr.v);
            if (pr.stops) studioStops[activeId] = pr.stops.map((st) => ({ ...st }));
            buildControls();
            renderPreviewAndCode();
          });
          presetsContainer.appendChild(btn);
        });

        // Controls
        controlsContainer.innerHTML = '';
        panel.controls.forEach((c) => {
          const wrap = document.createElement('div');
          wrap.className = 'ctrl';

          if (c.type === 'range') {
            wrap.innerHTML = `
              <div class="ctrl__top">
                <label class="ctrl__label">${c.label}</label>
                <span class="ctrl__num-wrap">
                  <input class="ctrl__num" type="number" min="${c.min}" max="${c.max}" step="${c.step}" value="${vals[c.k]}" />
                  ${c.unit ? `<span class="ctrl__unit">${c.unit}</span>` : ''}
                </span>
              </div>
              <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${vals[c.k]}" />
            `;
            const range = wrap.querySelector('input[type="range"]');
            const num = wrap.querySelector('input[type="number"]');
            const sync = (val) => {
              const n = parseFloat(val);
              if (Number.isNaN(n)) return;
              vals[c.k] = n;
              range.value = n;
              num.value = n;
              renderPreviewAndCode();
            };
            range.addEventListener('input', (e) => sync(e.target.value));
            num.addEventListener('input', (e) => sync(e.target.value));
          } else if (c.type === 'color') {
            wrap.innerHTML = `
              <div class="ctrl__row">
                <label class="ctrl__label">${c.label}</label>
                <div class="ctrl__color-wrap">
                  <span class="ctrl__hex">${vals[c.k]}</span>
                  <input class="ctrl__color" type="color" value="${vals[c.k]}" />
                </div>
              </div>
            `;
            const input = wrap.querySelector('input');
            const hex = wrap.querySelector('.ctrl__hex');
            input.addEventListener('input', (e) => {
              vals[c.k] = e.target.value;
              hex.textContent = e.target.value;
              renderPreviewAndCode();
            });
          } else if (c.type === 'select') {
            const opts = c.options.map(([v, l]) => `<option value="${v}" ${vals[c.k] === v ? 'selected' : ''}>${l}</option>`).join('');
            wrap.innerHTML = `<label class="ctrl__label">${c.label}</label><select class="ctrl__select">${opts}</select>`;
            wrap.querySelector('select').addEventListener('change', (e) => {
              vals[c.k] = e.target.value;
              renderPreviewAndCode();
            });
          } else if (c.type === 'toggle') {
            wrap.innerHTML = `
              <div class="ctrl__row">
                <label class="ctrl__label">${c.label}</label>
                <label class="switch">
                  <input type="checkbox" ${vals[c.k] ? 'checked' : ''} />
                  <span class="switch__slider"></span>
                </label>
              </div>
            `;
            wrap.querySelector('input').addEventListener('change', (e) => {
              vals[c.k] = e.target.checked;
              renderPreviewAndCode();
            });
          } else if (c.type === 'text') {
            wrap.innerHTML = `<label class="ctrl__label">${c.label}</label><input class="ctrl__text" type="text" value="${vals[c.k]}" maxlength="28" />`;
            wrap.querySelector('input').addEventListener('input', (e) => {
              vals[c.k] = e.target.value;
              renderPreviewAndCode();
            });
          }

          controlsContainer.appendChild(wrap);
        });

        if (typeof panel.customUI === 'function') {
          panel.customUI(controlsContainer, vals, renderPreviewAndCode);
        }

        if (panel.note) {
          panelNote.textContent = panel.note;
          panelNote.hidden = false;
        } else {
          panelNote.hidden = true;
        }
      }

      function selectPanel(id, { syncHash = true } = {}) {
        activeId = id;
        document.querySelectorAll('.tab').forEach((t) => {
          t.setAttribute('aria-selected', t.dataset.id === id ? 'true' : 'false');
        });
        buildControls();
        renderPreviewAndCode();
        if (syncHash && history.replaceState) {
          history.replaceState(null, '', `#${id}`);
        }
      }

      // Глубокие ссылки: открыть панель из адреса (#text-stroke)
      function panelFromHash() {
        const id = location.hash.replace(/^#/, '');
        return PANELS.some((p) => p.id === id) ? id : PANELS[0].id;
      }

      window.addEventListener('hashchange', () => {
        const id = panelFromHash();
        if (id !== activeId) selectPanel(id, { syncHash: false });
      });

      // Navigation ‹ / ›
      function stepPanel(dir) {
        const idx = PANELS.findIndex((p) => p.id === activeId);
        const next = (idx + dir + PANELS.length) % PANELS.length;
        selectPanel(PANELS[next].id);
        const activeTab = document.querySelector(`.tab[data-id="${PANELS[next].id}"]`);
        activeTab?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      document.addEventListener('keydown', (event) => {
        const tag = (event.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        if (event.key === 'ArrowLeft') { event.preventDefault(); stepPanel(-1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); stepPanel(1); }
      });

      prevBtn.addEventListener('click', () => stepPanel(-1));
      nextBtn.addEventListener('click', () => stepPanel(1));

      // Reset
      resetBtn.addEventListener('click', () => {
        const panel = PANELS.find((p) => p.id === activeId);
        panel.controls.forEach((c) => (state[activeId][c.k] = c.def));
        delete studioStops[activeId];
        delete studioImages[activeId];
        buildControls();
        renderPreviewAndCode();
      });

      // Copy CSS
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(currentCss);
          copyBtn.textContent = '✓ Скопировано';
          copyBtn.classList.add('btn--success');
          setTimeout(() => {
            copyBtn.textContent = 'Копировать CSS';
            copyBtn.classList.remove('btn--success');
          }, 1500);
        } catch {
          copyBtn.textContent = 'Выделите код вручную';
        }
      });

      // Preview background switch
      document.getElementById('bgSwitch').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-bg]');
        if (!btn) return;
        previewStage.dataset.bg = btn.dataset.bg;
        document.querySelectorAll('#bgSwitch button').forEach((b) => b.classList.toggle('is-active', b === btn));
      });

      // Live search & "/" shortcut
      panelSearch.addEventListener('input', () => {
        const q = panelSearch.value.trim().toLowerCase();
        document.querySelectorAll('.tab-group').forEach((g) => {
          let visible = 0;
          g.querySelectorAll('.tab').forEach((t) => {
            const match = !q || t.dataset.search.includes(q);
            t.classList.toggle('is-hidden', !match);
            if (match) visible++;
          });
          g.classList.toggle('is-empty', visible === 0);
        });
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          openDrawer();
          panelSearch.focus();
        } else if (e.key === 'Escape') {
          if (document.activeElement === panelSearch && panelSearch.value) {
            panelSearch.value = '';
            panelSearch.dispatchEvent(new Event('input'));
          } else {
            closeDrawer();
          }
        }
      });

      // Mobile drawer
      const openDrawer = () => {
        sidebar.classList.add('is-open');
        drawerBackdrop.classList.add('is-open');
      };
      const closeDrawer = () => {
        sidebar.classList.remove('is-open');
        drawerBackdrop.classList.remove('is-open');
      };
      menuBtn.addEventListener('click', openDrawer);
      sidebarClose.addEventListener('click', closeDrawer);
      drawerBackdrop.addEventListener('click', closeDrawer);

      // Init
      buildSidebar();
      selectPanel(panelFromHash(), { syncHash: false });
    </script>
  </body>
</html>
